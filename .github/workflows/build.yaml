name: Build and push the image

# One image per commit: ghcr.io/alexandredfm/alexandredfm:<sha>.
# - push on staging: checks, then build the image (also tagged "staging"), then deploy
# - push on main: the commit was promoted from staging (fast-forward), so its
#   image already exists and is only re-tagged "latest"; a commit that was
#   never built (hotfix) is built here. Then deploy (deploy.yaml).
# Re-run this workflow to redeploy the same commit (settings or secret change).
on:
  push:
    branches: [staging, main]
    paths:
      - "portfolio/**"
      - "k8s/**"
      - ".github/workflows/build.yaml"
      - ".github/workflows/deploy.yaml"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/alexandredfm/alexandredfm

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yaml

  image:
    name: Build or promote the image
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Does the image of this commit exist?
        id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE:$GITHUB_SHA already built (tested on staging): promoting it"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./portfolio
          push: true
          # linux/amd64,linux/arm64 for ARM nodes (repository variable)
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag for the branch
        env:
          TAG: ${{ github.ref_name == 'main' && 'latest' || 'staging' }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$GITHUB_SHA"
          echo "$IMAGE:$GITHUB_SHA -> $IMAGE:$TAG"

  deploy:
    name: Deploy
    needs: [image]
    uses: ./.github/workflows/deploy.yaml
    # Environment secrets (KUBE_CONFIG...) are read by the deploy job itself
    secrets: inherit
