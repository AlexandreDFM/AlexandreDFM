# TLS between Cloudflare and Traefik: for now Traefik's default certificate
# ("tls: {}"), accepted by Cloudflare in SSL mode "Full". Later, Cloudflare Origin
# certificate + mode "Full (strict)": replace "tls: {}" by
#   tls:
#     secretName: alexandredfm-tls
# (k8s/README.md, "Certificat Cloudflare Origin"); the deploy workflow then
# checks that this Secret exists.
# staging.alexandredfm.fr only: a second-level subdomain such as
# www.staging.alexandredfm.fr is not covered by Cloudflare's universal certificate.
# The DNS record must be proxied (orange cloud) so the server IP stays hidden.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alexandredfm-web
  labels:
    app.kubernetes.io/name: alexandredfm
    app.kubernetes.io/component: web
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`staging.alexandredfm.fr`)
      kind: Rule
      # Wins over the former IngressRoute (same host) until the admin deletes it
      priority: 1000
      services:
        - name: alexandredfm-web
          port: http
