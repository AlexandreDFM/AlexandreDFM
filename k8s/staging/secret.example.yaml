# EXAMPLE ONLY - never commit real values. The deploy workflow creates these
# objects in alexandredfm-staging from the GitHub environment "staging":
apiVersion: v1
kind: ConfigMap
metadata:
  name: alexandredfm-app-config
data:
  SITE_URL: https://staging.alexandredfm.fr   # Variable PUBLIC_SITE_URL
  DIRECTUS_URL: https://my-api.alexandredfm.fr                    # Variable DIRECTUS_URL
  SITE_NOINDEX: "true"                                            # Variable SITE_NOINDEX
  GOOGLE_SITE_VERIFICATION: ""                                    # Variable GOOGLE_SITE_VERIFICATION (optional)
---
apiVersion: v1
kind: Secret
metadata:
  name: alexandredfm-app
type: Opaque
stringData:
  DIRECTUS_WEBSITE_TOKEN: CHANGE_ME   # Secret DIRECTUS_WEBSITE_TOKEN (read-only website user)
---
# Created once by the admin (Cloudflare Origin certificate), checked by the workflow
apiVersion: v1
kind: Secret
metadata:
  name: alexandredfm-tls
type: kubernetes.io/tls
stringData:
  tls.crt: "-----BEGIN CERTIFICATE----- ..."
  tls.key: "-----BEGIN PRIVATE KEY----- ..."
