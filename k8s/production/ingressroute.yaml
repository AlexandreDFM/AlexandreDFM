# TLS between Cloudflare and Traefik: for now Traefik's default certificate
# ("tls: {}"), accepted by Cloudflare in SSL mode "Full". Later, Cloudflare Origin
# certificate + mode "Full (strict)": replace "tls: {}" by
#   tls:
#     secretName: alexandredfm-tls
# (k8s/README.md, "Certificat Cloudflare Origin"); the deploy workflow then
# checks that this Secret exists.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alexandredfm-web
  labels:
    app.kubernetes.io/name: alexandredfm
    app.kubernetes.io/component: web
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`alexandredfm.fr`)
      kind: Rule
      # Wins over the former IngressRoute (same host) until the admin deletes it
      priority: 1000
      services:
        - name: alexandredfm-web
          port: http
    # One canonical host: www -> apex (no duplicate content)
    - match: Host(`www.alexandredfm.fr`)
      kind: Rule
      # Wins over the former IngressRoute (same host) until the admin deletes it
      priority: 1000
      middlewares:
        - name: alexandredfm-redirect-www
      services:
        - name: alexandredfm-web
          port: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: alexandredfm-redirect-www
  labels:
    app.kubernetes.io/name: alexandredfm
    app.kubernetes.io/component: web
spec:
  redirectRegex:
    regex: ^https?://www\.alexandredfm\.fr/(.*)
    replacement: https://alexandredfm.fr/${1}
    permanent: true
