# Next.js web server (standalone output, port 3000).
# Configuration: ConfigMap alexandredfm-app-config (GitHub Variables) and
# Secret alexandredfm-app (GitHub Secrets), both created by the deploy workflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexandredfm-web
  labels:
    app.kubernetes.io/name: alexandredfm
    app.kubernetes.io/component: web
spec:
  replicas: 1   # stateless (sessions are cookies): can be raised if needed
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # the old pod serves until the new one is ready
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alexandredfm
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alexandredfm
        app.kubernetes.io/component: web
    spec:
      # Created by the workflow from GHCR_PULL_TOKEN; ignored when missing (public package)
      imagePullSecrets:
        - name: github-container-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/alexandredfm/alexandredfm:latest   # tag replaced by the commit SHA on deploy
          # Tags are commit SHAs (immutable): no need to pull again
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: alexandredfm-app-config   # GitHub Variables
                optional: true
            - secretRef:
                name: alexandredfm-app          # GitHub Secrets
          ports:
            - name: http
              containerPort: 3000
          # On a rollout, Traefik keeps sending requests to the old pod for a few
          # seconds after it is told to stop (502 seen on /fr). The pause keeps it
          # serving until it is removed from the endpoints; SIGTERM comes after.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /api/server/health
              port: http
            periodSeconds: 5
            failureThreshold: 24   # up to 2 minutes to start
          readinessProbe:
            httpGet:
              path: /api/server/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Writable paths of a read-only container
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
