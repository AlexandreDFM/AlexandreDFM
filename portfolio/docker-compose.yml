# Local development stack: Postgres + Redis + Directus + Next.js (hot reload).
#
# First run:
#   for f in database directus frontend; do cp env/.env.$f.template env/.env.$f; done
#   (edit the values) then: docker compose up -d
#
# Frontend: http://localhost:3000   Directus: http://localhost:8055

name: alexandredfm-dev

services:
  # PostgreSQL Database
  database:
    image: postgres:17
    container_name: alexandredfm-portfolio-database-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - alexandredfm-portfolio-db:/var/lib/postgresql/data
    env_file:
      - ./env/.env.database
    networks:
      - alexandredfm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  cache:
    image: redis:8
    container_name: alexandredfm-portfolio-redis-cache
    restart: unless-stopped
    ports:
        - "127.0.0.1:6379:6379"
    networks:
        - alexandredfm-network
    healthcheck:
      test: [ "CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Directus Backend (same version as the my-api deployment)
  backend:
    container_name: alexandredfm-portfolio-backend
    image: directus/directus:11.10.2
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
        - "127.0.0.1:8055:8055"
    volumes:
        - ./backend/uploads:/directus/uploads
        - ./backend/extensions:/directus/extensions
    env_file:
        - ./env/.env.directus
    networks:
        - alexandredfm-network

  # Next Frontend
  frontend:
    container_name: alexandredfm-portfolio-frontend
    build:
      context: ./
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /usr/src/app
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    env_file:
      - ./env/.env.frontend
    networks:
      - alexandredfm-network

networks:
  alexandredfm-network:
    driver: bridge

volumes:
    alexandredfm-portfolio-db:
